dataset_str:
  "DiverCamWAI(
    split='${dataset.divercam_wai.val.split}',
    resolution=${dataset.divercam_wai.val.dataset_resolution},
    principal_point_centered=${dataset.divercam_wai.val.principal_point_centered},
    seed=${dataset.divercam_wai.val.seed},
    transform='${dataset.divercam_wai.val.transform}',
    data_norm_type='${dataset.divercam_wai.val.data_norm_type}',
    ROOT='${dataset.divercam_wai.val.ROOT}',
    min_coverage=${dataset.divercam_wai.val.min_coverage},
    temporal_prob=${dataset.divercam_wai.val.temporal_prob},
    overfit_num_sets=${dataset.divercam_wai.val.overfit_num_sets},
    variable_num_views=${dataset.divercam_wai.val.variable_num_views},
    num_views=${dataset.divercam_wai.val.num_views},
    covisibility_thres=${dataset.divercam_wai.val.covisibility_thres},
    pose_prior='${dataset.divercam_wai.val.pose_prior}', pose_prior_noise_trans=${dataset.divercam_wai.val.pose_prior_noise_trans}, pose_prior_noise_rot=${dataset.divercam_wai.val.pose_prior_noise_rot},
    num_forward_views=${dataset.divercam_wai.val.num_forward_views},
    forward_sampling='${dataset.divercam_wai.val.forward_sampling}',
    forward_offset=${dataset.divercam_wai.val.forward_offset},
    forward_min_coverage=${dataset.divercam_wai.val.forward_min_coverage}, forward_covis_thres=${dataset.divercam_wai.val.forward_covis_thres}, max_forward_fraction=${dataset.divercam_wai.val.max_forward_fraction}, sample_forward_count=${dataset.divercam_wai.val.sample_forward_count}, forward_depth_supervision=${dataset.divercam_wai.val.forward_depth_supervision}, forward_depth_max_range=${dataset.divercam_wai.val.forward_depth_max_range}, forward_score='${dataset.divercam_wai.val.forward_score}', forward_min_support=${dataset.divercam_wai.val.forward_min_support}, forward_max_range=${dataset.divercam_wai.val.forward_max_range}, covis_version='${dataset.divercam_wai.val.covis_version}')"
# "<split name>:<part>" -- a yaml in loggerhead/configs/splits, and which part of it
split: 'holdout_boobyrock:val'
dataset_resolution: ${dataset.resolution_val_divercam}
principal_point_centered: ${dataset.principal_point_centered}
seed: 777
transform: 'imgnorm'
data_norm_type: ${model.data_norm_type}
# One tree for every divercam experiment. It carries the forward frames as well,
# but num_forward_views: 0 ignores them, and the down-down covisibility cells are
# bit-identical either way, so a downward-only run reads exactly what it used to.
# There used to be a separate downward-only divercam_wai tree; keeping two trees in
# sync is how the raw-intrinsics calibration propagated into four places at once.
ROOT: ${root_data_dir}/divercam_wai_fwd
# probability of a consecutive-frame window instead of a covisibility set
temporal_prob: 0.0
# drop frames whose Metashape depth covers less than this fraction of pixels
min_coverage: 0.3
overfit_num_sets: null
variable_num_views: ${dataset.val.variable_num_views}
num_views: ${dataset.num_views}
covisibility_thres: 0.25
# what to feed the model's pose conditioning: none | ekf | gt | gt+noise.
# 'gt' is LEAKAGE -- the pose head is supervised on those same poses.
pose_prior: 'none'
# Gaussian perturbation applied to a 'gt+noise' prior, isotropic on translation
# (the same sigma on each axis) and a random-axis rotation of Gaussian angle.
# Applied to ABSOLUTE poses, and the model relativises to view 0, so the error
# on a view-0-relative prior is sqrt(2)*sigma and does NOT grow with how far
# apart the views are. That models a factor-graph-fused pose, not the EKF, whose
# error grows as roughly span^0.73 and reaches 4.5 m on covisibility windows.
pose_prior_noise_trans: 0.0
pose_prior_noise_rot: 0.0

# Forward-camera views, budgeted INSIDE num_views. 0 keeps the scene downward-only,
# so an unmodified divercam_wai tree behaves exactly as before.
num_forward_views: 0
# covis | offset. Same-instant down/forward footprint overlap is measured at ZERO
# (the two abut), so "covis" is the principled default; "offset" takes the forward
# frame forward_offset frames away, where overlap actually peaks.
forward_sampling: 'covis'
forward_offset: -60
# forward depth is rendered from downward geometry and is structurally sparser than
# min_coverage expects -- and absent entirely in the input-only arm
forward_min_coverage: 0.0
forward_covis_thres: 0.15
# v1 fixed the cross-camera statistic (target-image coverage, not fraction-of-source-
# points, which saturated). Same-camera cells are bit-identical to the retired v0.
covis_version: 'v1'
# ceiling on the forward share of a window; 1.0 + num_forward_views==num_views
# gives an all-forward window (eval-time exploration)
max_forward_fraction: 0.25
# Draw the forward count from U(0, cap) instead of pinning it at the cap, so
# window composition is trained over rather than fixed.
sample_forward_count: false
# Forward pseudo-depth builds the covisibility matrix but is withheld from the
# loss: forward views are input-side information only for now.
forward_depth_supervision: false
# Metres. Forward pseudo-depth beyond this is zeroed and so falls out of
# valid_mask. 0 disables. 4.0 is where pseudo-depth stops agreeing with the
# forward camera's own ZED stereo; see the dataloader for the measurement.
forward_depth_max_range: 0.0
# max | mean. How a forward frame's covisibility against the window's downward
# frames is collapsed into one score. "max" admits it on its single best
# overlap; "mean" requires it to be seen by several. forward_covis_thres must be
# recalibrated when this changes -- the mean of six values is far below the max.
forward_score: 'max'
# How many downward frames must individually see more than forward_covis_thres
# of the forward frame. 1 = original behaviour. Separate from forward_score:
# mean scoring alone admits broadly-but-weakly overlapped frames, which the
# error measurement never covered.
forward_min_support: 1
# Metres. A forward candidate must lie within this distance of the downward
# frame it overlaps MOST. 0 disables. Overlap does not bound camera separation
# for an oblique camera, so distance has to be constrained directly; forward
# camera error roughly doubles per metre of that separation.
forward_max_range: 0.0
