defaults:
  - default

# Covisibility-only sampling: `temporal_prob` stays at the default 0.0, so every
# window is a random walk over the covisibility graph. `divercam_mix_8v` is this
# config with half the windows drawn temporally instead; the pair is what measures
# whether temporal windows help.
#
# Which surveys train and which are held out is NOT set here -- it comes from
# `dataset/divercam_wai/{train,val}/default.yaml`, currently `holdout_boobyrock`.
# Validation is held back SPATIALLY within each training survey (see
# scripts/divercam_make_split.py); it used to be a frame range, which leaked
# 19-31% of training frames through covisibility.
#
# 5_000 samples per epoch is chosen for check-in granularity rather than for any
# statistical reason: on 3 GPUs at ~1.6 s/iteration that is ~45 min, so held-out
# metrics can be read off a fresh checkpoint roughly hourly instead of after a
# multi-hour epoch.
num_views: 8

# Landscape-only, and deliberately NOT 518_many_ar. Two reasons: 518_many_ar
# includes (518,518), which pushed peak memory to 46,190 MiB -- 122 MB more than
# an L40 has (46,068 MiB), so it OOM'd rank 2 on tharp one iteration in. And our
# frames are 960x600, aspect 1.6, so square and portrait crops throw most of the
# image away. Max here is (518,392), measured at ~40.6 GB.
resolution_train: ${dataset.resolution_options.518_many_non_square_landscape_ar}
resolution_val_divercam: ${dataset.resolution_options.518_1_33_ar}

train_dataset: "+ 5_000 @ ${dataset.divercam_wai.train.dataset_str}"
test_dataset: "+ 500 @ ${dataset.divercam_wai.val.dataset_str}"
