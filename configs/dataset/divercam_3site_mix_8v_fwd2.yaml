defaults:
  - divercam_3site_mix_cond_8v

# divercam_3site_mix_cond_8v with two of the eight views taken from the FORWARD
# camera. Everything else is held fixed -- including `pose_prior: 'ekf'`, which is
# inherited, not restated -- so the comparison isolates the camera change against
# the conditioned 8-down run that is our headline result.
#
# This is the "input-only" arm: the forward views here carry no depth at all, so
# they are supervised on pose and ray directions -- both exact, from the rig
# calibration and the forward intrinsics -- and contribute nothing to the depth
# family of losses, which losses.py:2352 drops for a fully-invalid view. Point
# `forward_depth` at rendered pseudo-depth in a sibling config for the other arm.
#
# Two things to keep in mind when reading results from this config:
#
#   The baseline is arguable. 6 down + 2 forward against 8 down trades two densely
#   supervised views for two sparser ones. 8 down + 2 forward against 8 down holds
#   the downward window EXACTLY and confounds only on view count and compute, which
#   is probably the cleaner comparison; 10 down against 8 down + 2 forward matches
#   count but changes span and overlap, which error tracks closely. There is no way
#   to add downward views to a temporal window without moving one of the two.
#
#   What a good mixed window looks like is not settled. The 2 views and the -60
#   frame offset are a starting point, not a considered choice; most of that is
#   explorable at eval time on one checkpoint. forward_sampling 'auto' is NOT
#   arbitrary though -- it follows the branch that chose the downward views, so a
#   temporal window gets temporally adjacent forward frames and a covisibility set
#   gets covisible ones. A fixed 'covis' would hand half of all windows (temporal_prob
#   is 0.5) a dense downward set plus forward frames from anywhere in the survey.
#
# Needs a tree built with `divercam_to_wai.py --forward` and a covisibility matrix
# rebuilt over the enlarged frame list, hence the separate ROOT: the downward-only
# tree stays untouched so the established 8-view results remain reproducible.

divercam_wai:
  train:
    ROOT: ${root_data_dir}/divercam_wai_fwd
    num_forward_views: 2
    forward_sampling: 'auto'
    covis_version: 'v1'
  val:
    ROOT: ${root_data_dir}/divercam_wai_fwd
    num_forward_views: 2
    forward_sampling: 'auto'
    covis_version: 'v1'
